[package]
name = "scambox"
version = "0.1.0"
edition = "2021"
description = "ScamBox - serwer gry (Rust: axum + sqlx/PostgreSQL)"
publish = false

[dependencies]
anyhow = "1"
arc-swap = "1"
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.10", features = ["cookie-signed"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
form_urlencoded = "1"
hex = "0.4"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
indexmap = { version = "2", features = ["serde"] }
metrics = "0.24"
mime = "0.3"
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = ["http-listener"] }
minijinja = { version = "2", features = ["loader"] }
parking_lot = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
rand_chacha = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scrypt = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_with = { version = "3", features = ["indexmap_2"] }
sha2 = "0.10"
strum = { version = "0.27", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
webp = "0.3"
rust-embed = { version = "8", features = ["mime-guess"] }

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
lto = "thin"
