# Budowanie obrazu (server/Dockerfile) i wdrożenie na Azure App Service (Linux, kontener) po każdym pushu do main.
# Obraz trafia do GitHub Container Registry (ghcr.io). Wymagane w repo (Settings -> Secrets and variables -> Actions):
#   zmienne:  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (logowanie OIDC, bez hasła - to nie są tajne dane)
#             AZURE_WEBAPP_NAME
# Jednorazowa konfiguracja aplikacji: docs/hosting.md, sekcja "Azure App Service (Linux)".
name: Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

concurrency:
  group: azure-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/famechests

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # nazwa obrazu w ghcr.io musi być małymi literami
      - name: Nazwa obrazu
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Budowanie obrazu
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE }}:${{ github.sha }}
